backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME   # ⚠️ இதை உங்க actual GitHub username/repo-ஆ மாத்துங்க
  branch: main
  base_url: https://YOUR_SITE.pages.dev        # ⚠️ இதை உங்க Cloudflare Pages domain-ஆ மாத்துங்க
  auth_endpoint: auth

# GitHub OAuth மூலம் CMS login — Cloudflare Pages Functions (/functions/auth.js, /functions/callback.js)
# வழியாக token exchange நடக்கும். Netlify Identity இனி தேவையில்லை.

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "interviews"
    label: "நேர்காணல்கள்"
    label_singular: "நேர்காணல்"
    folder: "src/content/interviews"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}} — {{authorName}}"
    fields:
      - { label: "தலைப்பு", name: "title", widget: "string" }
      - { label: "எழுத்தாளர் பெயர்", name: "authorName", widget: "string" }
      - { label: "எழுத்தாளர் பணி (கவிஞர் / நாவலாசிரியர் etc.)", name: "authorRole", widget: "string", required: false }
      - { label: "எழுத்தாளர் படம்", name: "authorPhoto", widget: "image" }
      - { label: "நேர்காணல் Cover படம்", name: "coverImage", widget: "image" }
      - { label: "நேர்காணல் கண்டவர் பெயர்", name: "interviewerName", widget: "string", required: false }
      - label: "பிரிவு"
        name: "category"
        widget: "select"
        options: ["இலக்கியம்", "கலை & வரலாறு", "இசை", "சினிமா", "விமர்சனம்"]
      - { label: "இதழ் எண்", name: "issueNumber", widget: "string", required: false }
      - label: "Subject Tags (எ.கா. அரசியல், கவிதையியல், வரலாறு — footer மற்றும் archive-ல் தானாகத் தெரியும்)"
        name: "tags"
        widget: "list"
        field: { label: "Tag", name: "tag", widget: "string" }
        required: false
      - { label: "வெளியான தேதி", name: "date", widget: "datetime" }
      - { label: "சுருக்க அறிமுகம் (archive card-ல் தெரியும்)", name: "excerpt", widget: "text" }
      - { label: "Homepage Hero-ல் காட்டவா?", name: "featured", widget: "boolean", default: false }
      - label: "கேள்வி - பதில்கள்"
        name: "qa"
        widget: "list"
        summary: "{{fields.question}}"
        fields:
          - { label: "கேள்வி", name: "question", widget: "string" }
          - { label: "பதில்", name: "answer", widget: "text" }
      - label: "முக்கிய மேற்கோள்கள் (நகரும் மேற்கோள் சுவரில் தானாகக் காட்டப்படும்)"
        name: "pullQuotes"
        widget: "list"
        field: { label: "மேற்கோள்", name: "quote", widget: "string" }
        required: false
      - { label: "Body (விருப்பம்)", name: "body", widget: "markdown", required: false }
